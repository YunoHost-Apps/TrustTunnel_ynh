#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "trusttunnel"
name = "TrustTunnel"
description.en = "VPN over HTTPS, to bypass from Internet censorship"
description.fr = "DU VPN sur HTTPS, pour contourner une censure d'Internet"

version = "1.0.33~ynh1"

maintainers = [ "OniriCorpe" ]

[upstream]
license = "Apache-2.0"
website = "https://trusttunnel.org"
admindoc = "https://doc.yunohost.org/dev/packaging/"
code = "https://github.com/TrustTunnel/TrustTunnel"
cpe = "cpe:2.3:a:adguard:trusttunnel"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = [ "amd64", "arm64" ]
multi_instance = true

ldap = "not_relevant"
sso = "not_relevant"

# FIXME: replace with an **estimate** minimum disk and RAM requirements. e.g. 20M, 400M, 1G...
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    # this is a generic question - ask strings are automatically handled by YunoHost's core
    type = "domain"

    [install.path]
    # this is a generic question - ask strings are automatically handled by YunoHost's core
    type = "path"
    default = "/example"

    [install.admin]
    # this is a generic question - ask strings are automatically handled by YunoHost's core
    type = "user"

    [install.password]
    # this is a generic question - ask strings are automatically handled by YunoHost's core
    # Note that user-provided passwords questions are not automatically saved as setting
    help.en = "Use the help field to add an information for the admin about this question."
    help.fr = "Utilisez le champ aide pour ajouter une information à l'intention de l'administrateur à propos de cette question."
    type = "password"

[resources]
    # See the packaging documentation for the full set
    # of explanation regarding the behavior and properties for each of those

    [resources.sources]

    [resources.sources.main]
    arm64.url = "https://github.com/TrustTunnel/TrustTunnel/releases/download/v1.0.33/trusttunnel-v1.0.33-linux-aarch64.tar.gz"
    arm64.sha256 = "8b0d13d11f607c1da18be921096de3f85af67520b305aad425c74dd4f6775697"
    amd64.url = "https://github.com/TrustTunnel/TrustTunnel/releases/download/v1.0.33/trusttunnel-v1.0.33-linux-x86_64.tar.gz"
    amd64.sha256 = "48802662bc745aed60207c6ed6465d9fed428b1e53532045689d89bcad19bdd9"
    autoupdate.strategy = "latest_github_version"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    main.show_tile = false
    main.allowed = "visitors"
    main.protected = true

    [resources.ports]

    [resources.database]
    type = "mysql"
